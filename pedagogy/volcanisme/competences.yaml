# Graphe de compétences — tranche Volcanisme (SVT 2AC, Unité 1)
# Statut global : PROPOSÉ — dérivé des guides et manuels reçus, NON validé par un enseignant.
# Programme officiel collège non reçu (R-01) : ce graphe n'est pas une reproduction du programme.
# Références : Dxx pNNN = page PDF du fichier Dxx (voir docs/DOCUMENT_REGISTER.md).
# origine : "source" = énoncé présent dans les sources citées ; "proposé" = formulé par Claude, à valider.

meta:
  discipline: SVT
  niveau: 2AC parcours international option français
  unite: "U1 Les phénomènes géologiques internes"
  chapitre: "Le volcanisme et sa relation avec la tectonique des plaques"
  version: 0.1
  date: 2026-10-07
  perimetre_exclu:
    - "Structures des roches magmatiques (grenue/microlitique), granite, gabbro : chapitre « roches magmatiques » distinct dans D11, D13, D17 (fusionné dans D12). Prolongement, pas dans la tranche."

prerequis:   # chapitre « Tectonique des plaques », diagnostiqué en entrée
  - id: P1
    enonce: "Définir une plaque lithosphérique et repérer ses limites sur une carte."
    sources: [D17 p010, D17 p008-009, D11 ch.1, D12 ch.1]
    origine: source
  - id: P2
    enonce: "Distinguer mouvements de divergence (dorsale) et de convergence (subduction)."
    sources: [D17 p010, D13 p045]
    origine: source
  - id: P3
    enonce: "Associer courants de convection et déplacement des plaques."
    sources: [D17 p010]
    origine: source
  - id: P4
    enonce: "Situer lithosphère, asthénosphère/manteau sur un schéma de la structure du globe."
    sources: [D02 p002 ex.1, D11 p044]
    origine: source

connaissances:
  - id: K1
    enonce: "Un volcan émet des produits liquides (lave), gazeux et solides (cendres, lapilli, bombes)."
    sources: [D12 p035, D13 p047, D02 p003 C]
    origine: source
  - id: K2
    enonce: "Le magma naît de la fusion partielle de roches en profondeur, s'accumule dans une chambre magmatique puis monte par la cheminée."
    sources: [D12 p035 q4, D02 p003 B]
    origine: source
  - id: K3
    enonce: "Éruption effusive : lave fluide, peu de gaz, coulées calmes, cône."
    sources: [D12 p036, D11 p042, D13 p047, D18 p016]
    origine: source
  - id: K4
    enonce: "Éruption explosive : lave visqueuse qui emprisonne les gaz, dôme, explosions, panaches et nuées ardentes."
    sources: [D12 p036, D11 p042, D13 p047, D18 p016]
    origine: source
  - id: K5
    enonce: "Le type d'éruption dépend de la viscosité du magma et de sa teneur en gaz."
    sources: [D12 p036 q5, D11 p044 tâche 3]
    origine: source
  - id: K6
    enonce: "Aux dorsales (divergence) : volcanisme sous-marin effusif, basalte en coussins, accrétion de lithosphère océanique."
    sources: [D12 p037, D13 p045, D13 p047, D11 p044, D18 p016]
    origine: source
  - id: K7
    enonce: "Aux zones de subduction (convergence) : volcanisme explosif, magma issu de la fusion partielle liée à l'enfouissement de la plaque océanique."
    sources: [D11 p044, D13 p047]
    origine: source
  - id: K8
    enonce: "La répartition mondiale des volcans suit les limites de plaques (dorsales, ceinture de feu du Pacifique) ; il existe aussi un volcanisme intraplaque."
    sources: [D13 p045, D11 p042 (intraplaque mentionné)]
    origine: source

competences:   # savoir-faire évaluables ; chaque item d'évaluation doit en cibler au moins une
  - id: C1
    enonce: "Légender un schéma d'édifice volcanique (cratère, cheminée, chambre magmatique, cône, coulée)."
    connaissances: [K1, K2]
    type: schéma / vocabulaire
    sources: [D10 p002 ex.2, D02 p002 ex.1, D18 p015]
    origine: source
  - id: C2
    enonce: "Remettre dans l'ordre les étapes de la naissance du magma à l'éruption."
    connaissances: [K2]
    type: raisonnement / processus
    sources: [D02 p001 B, D11 p043 tâche 2]
    origine: source
  - id: C3
    enonce: "Comparer deux éruptions à partir de documents (photos, vidéo, données) et les classer effusive/explosive en justifiant."
    connaissances: [K3, K4]
    type: observation / interprétation de documents
    sources: [D02 p002 ex.2, D11 p042 tâche 1, D12 p036 q4]
    origine: source
  - id: C4
    enonce: "Expliquer la différence de dynamique éruptive par la viscosité et les gaz, notamment à partir d'une manipulation ou d'une simulation."
    connaissances: [K5]
    type: démarche expérimentale / raisonnement explicatif
    sources: [D11 p043 tâche 3, D12 p036 q5]
    origine: source
  - id: C5
    enonce: "Relier un type de volcanisme à un contexte tectonique (dorsale / subduction) à partir d'une carte ou d'un bloc-diagramme."
    connaissances: [K6, K7, K8]
    prerequis: [P1, P2]
    type: interprétation de documents / raisonnement
    sources: [D11 p044 tâches 1-3, D13 p045-047, D12 p037]
    origine: source
  - id: C6
    enonce: "Rédiger une courte synthèse explicative reliant volcanisme et tectonique des plaques (écrit ou oral)."
    connaissances: [K5, K6, K7]
    prerequis: [P2, P3]
    type: communication écrite/orale
    sources: [D11 p042 objectifs « Rédiger une synthèse », D11 p044 tâche 3]
    origine: source
  - id: C7
    enonce: "Évaluer le danger d'une éruption pour la population et le justifier."
    connaissances: [K4]
    type: raisonnement / citoyenneté
    sources: [D02 p004 ex.2 q3, D15 p045 (montagne Pelée 1902)]
    origine: source

erreurs_frequentes:   # hypothèses diagnostiques ; « source » = erreur ciblée par un distracteur ou une remarque des sources
  - id: M1
    enonce: "Le magma se forme dans la cheminée."
    cible: K2
    origine: source   # distracteur V/F D02 p001 A2 (corrigé « faux » p003)
  - id: M2
    enonce: "Une éruption explosive vient d'un magma fluide (inversion viscosité/explosivité)."
    cible: K5
    origine: source   # distracteur D02 p001 A4
  - id: M3
    enonce: "Lave et magma sont la même chose (oubli du dégazage)."
    cible: K1
    origine: source   # remarque D18 p016 « lave = magma après perte des gaz »
  - id: M4
    enonce: "Le magma provient d'un manteau entièrement liquide (au lieu d'une fusion partielle)."
    cible: K2
    origine: proposé   # à valider par l'enseignant
  - id: M5
    enonce: "Tous les volcans sont à des limites de plaques (le volcanisme intraplaque est ignoré)."
    cible: K8
    origine: proposé
  - id: M6
    enonce: "Confusion dorsale / subduction lors de l'association type de volcan ↔ contexte."
    cible: C5
    origine: proposé
  - id: M7
    enonce: "Une éruption effusive est sans aucun danger."
    cible: C7
    origine: proposé

sources_a_ne_pas_utiliser_telles_quelles:
  - "D11 p042 : « lave très visqueuse … 350 °C » (E-01). D12 p036 attribue 350 °C à la nuée ardente, pas à la lave."
  - "D11 p042-044 : « volcans explosives et intrusives », « basalte andésitique » (E-02)."
