name: Vérifier le MVP
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: asf
          POSTGRES_PASSWORD: test-password-only
          POSTGRES_DB: asf_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U asf -d asf_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - name: Tests SQLite
        run: python -m pytest -q
      - name: Tests PostgreSQL
        env:
          TEST_DATABASE_URL: postgresql://asf:test-password-only@localhost:5432/asf_test
        run: python -m pytest -q
      - name: Vérifier le JavaScript
        run: node --check web/app.js
      - name: Vérifier le corpus versionné
        run: python tools/check_content.py
