[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "alphastudyflex"
version = "0.1.0"
description = "MVP pédagogique SVT 2AC avec sources traçables"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3", "psycopg[binary]>=3.2,<4"]

[project.optional-dependencies]
corpus = ["PyMuPDF>=1.26,<2", "python-docx>=1.1,<2", "Pillow>=11,<13"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[tool.setuptools]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
